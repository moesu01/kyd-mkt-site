<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KYD Labs</title>
    <link rel="preconnect" href="https://rsms.me" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cossette+Texte:wght@400;700&family=Cossette+Titre:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Surface plate under the hero video so the bottom mask fades into section color -->
    <div id="hero-bg-surface" aria-hidden="true"></div>
    <!-- Outside React so Safari can honor autoplay during HTML parse -->
    <video
      id="hero-bg-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="/videos/ascii-animation-7.mp4" type="video/mp4" />
    </video>
    <!-- Footer media outside React for Safari autoplay; Footer mounts on hydrate -->
    <div id="footer-bg-surface" aria-hidden="true"></div>
    <video
      id="footer-bg-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source src="/videos/ascii-animation-9.mp4" type="video/mp4" />
    </video>
    <script>
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        var heroBgVideo = document.getElementById("hero-bg-video")
        if (heroBgVideo) heroBgVideo.style.display = "none"
        var footerBgVideo = document.getElementById("footer-bg-video")
        if (footerBgVideo) footerBgVideo.style.display = "none"
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
